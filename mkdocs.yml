# 과정 사이트 설정 — MkDocs Material 9.7 (requirements-docs.txt로 버전 고정)
#
# 로컬에서 보기 (저장소 루트에서):
#   pip install -r requirements-docs.txt
#   python tools/sync_site_assets.py        # 1) 수강생용 파일을 docs/downloads/ 로 복사 + 파일 표 갱신
#   mkdocs serve                             # 2) http://127.0.0.1:8000 에서 미리 보기
#   mkdocs build --strict -d site            # 3) 정적 사이트를 site/ 에 만든다(경고가 하나라도 있으면 실패)
#   OFFLINE=true mkdocs build -d site        # (USB·file:// 배포판) 검색까지 오프라인으로 동작
#
# 배포: .github/workflows/pages.yml (main에 push하면 GitHub Pages로 배포)

site_name: 생성형 AI 기반 무역 금융 리스크 최적화 과정
site_description: AI로 일하는 법을 6일 동안 손으로 익히는 실습 과정(ChatGPT · Claude · Claude Code + Git/GitHub)의 수강생 사이트 — 무역 금융은 실습 주제로, (가상) 한빛정밀(주) 데이터로 탐색 → 정제·특성 → 예측 → 결정 → 서비스 → 도입 기획까지 이론 요약과 실습 가이드
site_author: 한태구
# 배포 주소(GitHub Pages): brainini/tradefin-ai-2026 — 다른 조직·이름으로 옮기면 아래 세 줄을 함께 바꾼다.
#   site_url이 비어 있으면 404 페이지의 링크·스타일이 저장소 하위 주소(/tradefin-ai-2026/)에서 깨진다.
site_url: https://brainini.github.io/tradefin-ai-2026/
repo_url: https://github.com/brainini/tradefin-ai-2026
repo_name: tradefin-ai-2026
copyright: >-
  코드 MIT · 합성 데이터·문서 CC BY 4.0 · SEC 공시 발췌는 공개 공시의 교육용 일부 인용 ·
  (가상) 한빛정밀(주)·Halden은 교육용 가상 회사이며 실존 기업과 무관합니다

# file:// 로 열어도 링크가 깨지지 않도록 page.html 형태의 주소를 쓴다
use_directory_urls: false

theme:
  name: material
  language: ko
  custom_dir: overrides          # overrides/main.html — 글꼴 미리 연결 · 주소창 색 (hooks/ 의 파이썬은 사이트에 복사되지 않는다)
  font: false                    # 글꼴은 아래 extra_css에서(Pretendard · JetBrains Mono · Nanum Gothic Coding). 막히면 맑은 고딕으로 보이고 기능은 같다
  icon:
    logo: material/finance
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom            # 색은 docs/stylesheets/tf26.css의 토큰(덱과 같은 남색 · 파랑)
      accent: custom
      toggle:
        icon: material/weather-night
        name: 어두운 화면으로 바꾸기
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 밝은 화면으로 바꾸기
  features:
    - navigation.instant         # 쪽을 다시 받지 않고 바꾼다(왼쪽 메뉴 위치 유지) — OFFLINE 빌드에서는 자동으로 꺼진다
    - navigation.instant.progress
    - navigation.tabs            # 위쪽 탭 = 홈 · 시작하기 · 1–6일차 · 자료실, 왼쪽 메뉴는 고른 탭의 쪽만
    - navigation.path            # 쪽 위 경로 표시(홈 › 1일차 10/14)
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link        # 같은 이름의 탭(예: Windows / macOS)을 한 번 고르면 다른 페이지에서도 같은 탭이 열린다
    - search.highlight
    - search.suggest
    - toc.follow

# 디자인 시스템 — 색 · 부품은 docs/stylesheets/tf26.css, 동작(오늘 표시 · 단계 카드 · 진행 추적 · 열기 시각)은 docs/javascripts/tf26.js
extra_css:
  - https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css
  - https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nanum+Gothic+Coding:wght@400;700&display=swap
  - stylesheets/tf26.css

extra_javascript:
  - javascripts/tf26.js          # 오늘 표시 · 단계 카드 · 진행 추적 · 열기 시각 잠금 · 그림 확대 · 모바일 표 (의존성 없음)

extra:
  generator: false
  # ── 강사만 아는 주소 — 여기 한 곳만 고친다 ─────────────────────────────────────────
  # 값을 넣고 main에 push하면 다음 배포부터 사이트의 해당 자리(<span data-tf-link="키">)가 링크로 바뀐다.
  # 비워 두면 그 자리에는 주소를 실제로 받는 곳이 점선 알약으로 보이고 빌드는 깨지지 않는다(overrides/hooks/course_links.py):
  #   개강 전 항목(open_chat · pre_survey · venue) → '과정 안내 메시지(문자 · 메일)로 받은 주소'
  #   수업 중 항목(나머지)                        → '수업 중 화면 · 오픈채팅 공지로 받은 주소'(post_survey · peer_form은 6일차 종이 양식도)
  #   쪽이 data-tf-empty를 정했으면 그 글. 비워 두면 그 안내를 과정 안내 메시지 · 수업 화면 · 오픈채팅에서 꼭 해야 한다.
  course_links:
    open_chat: ""      # 오픈채팅방 주소 — 홈 공지
    pre_survey: ""     # 사전 설문(1일차 시작 전 · 10분, Google Forms) — 홈 공지
    submit_form: ""    # 산출물 제출 폼(1일차 A-1·05 내 저장소 주소 · 1–5일차 PR · 앱 주소) — 홈 공지 · 일차 쪽
    plan_form: ""      # 개인 도입 기획서 비공개 폼(5일차 21:00 초안 · 6일차 17:50 최종 · 수료 뒤 다시 내기)
    team_form: ""      # 6일차 15:50 팀 솔루션 킷 v1.0 링크 제출 폼
    post_survey: ""    # 6일차 16:55 사후 진단 폼(사전 설문과 같은 문항)
    peer_form: ""      # 6일차 발표 동료 피드백 · 투표 폼
    demo_app: ""       # 강사 데모 앱 주소(https://….streamlit.app) — 5일차 실습 B1 · B6 · 채팅 경로(로컬 실행이 안 될 때)
    venue: ""          # 강의장 이름 · 호실(링크가 아니면 글자로 보인다) — 홈 공지 · 과정 소개

hooks:
  - tools/mkdocs_hooks.py      # docs/downloads/ 의 .md 파일(보고서 발췌 등)을 페이지가 아닌 '내려받을 파일'로 복사
  - overrides/hooks/course_links.py   # extra.course_links의 주소를 쪽의 <span data-tf-link="키">에 채운다(비면 주소를 받는 곳 안내)
  - overrides/hooks/download_names.py   # 내려받기 단추의 download="download" → 실제 파일 이름(확장자 없는 'download'로 저장되지 않게)
  - overrides/hooks/inline_code.py      # 점검 시각(tf-check) · 그림 설명(figcaption) 같은 원시 HTML 안의 `코드` → <code>(백틱이 글자로 보이지 않게)

plugins:
  - search:
      lang:
        - ko
        - en
      # 한국어 문서용 분리 기호: 공백·가운뎃점(·)·괄호·쉼표·슬래시 등에서 낱말을 나눈다
      separator: '[\s​　\-_,:;!?/|()\[\]{}<>=·…~"`]+|\.(?!\d)'
  - offline:
      enabled: !ENV [OFFLINE, false]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - sane_lists               # 번호 목록이 중간 설명 뒤에도 7. 8. … 처럼 이어지게(시작 번호 존중)
  - toc:
      permalink: true
      # 한글 제목도 앵커가 생기게(소문자). 'P1-4 …'처럼 프롬프트 ID로 시작하는 제목은
      # tools/mkdocs_hooks.py가 앵커를 ID만으로(#p1-4) 바꾼다 → 제목 글자가 바뀌어도 링크 유지
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true  # 코드 블록에 language-text 같은 클래스 — 프롬프트(text)만 본문 글꼴로 보이게(tf26.css)
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [!relative $config_dir]   # 저장소 루트(mkdocs.yml 자리) 기준 — 어느 폴더에서 빌드해도 labs/day1/prompts.md 를 그대로 끼워 넣는다
      check_paths: false       # 아직 없는 파일은 비워 둔 채 빌드(파일이 생기면 자동으로 들어간다)

# docs/ 안에 있지만 사이트에 올리지 않는 것
#  - _snippets/ : 다른 페이지에 끼워 넣는 조각(tools/sync_site_assets.py가 만든다)
#  - assets/day1/ : Day1 정답 차트(정제 150개사 피벗 결과) — 실습 전에 공개하면 안 되므로 빌드에서 뺀다
exclude_docs: |
  _snippets/
  assets/day1/

# 메뉴에 없지만 빌드하는 페이지 — 옛 주소(Lab1–3)로 들어온 사람을 실습 A·B로 안내하는 한 줄짜리 페이지
not_in_nav: |
  day1/lab1.md
  day1/lab2.md
  day1/lab3.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  # 사이트 맵 = 위쪽 탭. 일차 탭 = 개요(index) · 이론 요약 · 실습 A(4–5교시) · 실습 B(6–7교시). 6일차는 해커톤 쪽이 더 있다.
  # 쪽 파일 경로 · 주소 · 앵커는 바꾸지 않는다(덱 노트 · 다른 쪽이 day1/lab-b.html#b1-diagnose처럼 부른다).
  # 옛 주소(day1/lab1–3.md)는 안내 한 줄만 남기고 메뉴에서 뺐다(위 not_in_nav).
  - 홈: index.md
  - 시작하기:
      - 과정 소개: course.md
      - 사전 준비: setup.md
      - 데이터: data.md
      - FAQ·트러블슈팅: faq.md
  - "1일차 10/14":
      - day1/index.md
      - "이론 요약": day1/theory.md
      - "실습 A · 13:00": day1/lab-a.md
      - "실습 B · 15:00": day1/lab-b.md
  - "2일차 10/15":
      - day2/index.md
      - "이론 요약": day2/theory.md
      - "실습 A · 13:00": day2/lab-a.md
      - "실습 B · 15:00": day2/lab-b.md
  - "3일차 10/16":
      - day3/index.md
      - "이론 요약": day3/theory.md
      - "실습 A · 13:00": day3/lab-a.md
      - "실습 B · 15:00": day3/lab-b.md
  - "4일차 10/19":
      - day4/index.md
      - "이론 요약": day4/theory.md
      - "실습 A · 13:00": day4/lab-a.md
      - "실습 B · 15:00": day4/lab-b.md
  - "5일차 10/20":
      - day5/index.md
      - "이론 요약": day5/theory.md
      - "실습 A · 13:00": day5/lab-a.md
      - "실습 B · 15:00": day5/lab-b.md
  - "6일차 10/21":
      - day6/index.md
      - "이론 요약": day6/theory.md
      - "실습 A · 09:31": day6/lab-a.md
      - "실습 B · 14:12": day6/lab-b.md
      - "위기 카드": day6/cards.md
      - "솔루션 킷": day6/kit.md
      - "심사 기준": day6/judging.md
      - "제출": day6/submit.md
  - 자료실:
      - 프롬프트 라이브러리:         # 이름에 '프롬프트'를 붙인다 — 6일차 '제출' 쪽 아래 '다음' 단추가 '1일차'로만 보이면 1일차 개요로 오해한다
          - "1일차 프롬프트": prompts/day1.md
          - "2일차 프롬프트": prompts/day2.md
          - "3일차 프롬프트": prompts/day3.md
          - "4일차 프롬프트": prompts/day4.md
          - "5일차 프롬프트": prompts/day5.md
          - "6일차 프롬프트": prompts/day6.md
      - 용어집: glossary.md
      - 기초 지식:
          - foundations/index.md
          - "F1 내 데이터는 어디로 가나": foundations/f1.md
          - "F2 웹·API, 그리고 커밋 이력": foundations/f2.md
          - "F3 같은 입력이면 같은 결과": foundations/f3.md
          - "F4 프로그램은 언제 도는가": foundations/f4.md
          - "F5 내 PC의 앱을 모두의 앱으로": foundations/f5.md
          - "F6 솔루션 킷 = 저장소 하나": foundations/f6.md
      - "내 업무를 AI 과업으로 정의하기": ax-project.md
