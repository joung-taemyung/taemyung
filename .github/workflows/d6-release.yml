# 6일차 서프라이즈 · 과정 뒤 공개 — 봉인 묶음(files 브랜치 sealed/*.tgz.enc)을 정한 시각에 풀어 files 브랜치에 올리고 사이트를 다시 만든다.
# 사람 손이 필요 없다: 키 = 저장소 시크릿 RELEASE_KEY · 시각 = files 브랜치 sealed/manifest.json · 실행 = 아래 예약(각 시각 −8 · −3 · +2 · +7 · +15분).
#   - 같은 묶음은 두 번 풀지 않는다(sealed/released.json) — 예약이 여러 번 떠도, 늦게 떠도, 하나가 빠져도 안전하다.
#   - 시각 20분 안에 뜬 실행은 그 시각까지 기다렸다가 푼다(예약 지연 대비). 시각 전 묶음은 force 없이 절대 풀지 않는다.
#   - 공개 로그에는 묶음 번호 · 개수 · 해시 OK/NG만 찍는다(파일 이름 · 내용 없음). 평문은 이 저장소 어디에도 없다.
# 묶음: x0 리허설 10/13 21:10 · r1 10/21 09:28 카드 · 팩 · r2 11:15 카드 ⑤ 2단계 · r3 11:30 인젝트 1 · r4 13:15 인젝트 2 · r5 18:00 6일차 PDF 완성판 · r6 19:00 원천 · 생성기
# 손으로 돌리기(Actions → d6-release → Run workflow): mode = dry-run(기본: 풀어서 해시만, 쓰지 않음) · release(시각이 된 묶음) · force(only의 묶음을 지금).
# 수업이 밀리면: 저장소 변수 D6_OFFSET_MIN = N(분) — 아직 안 나간 묶음 전체가 N분 늦게 열린다(Settings → Secrets and variables → Actions → Variables).
# 템플릿 사본(수강생 저장소)에서는 돌지 않는다 — 잡의 if: github.repository == … 가 막는다.
name: d6-release

on:
  schedule:
    # x0 리허설 — 10/13 21:10 KST(12:10Z). 늦게 push했으면 10/14 · 10/15 같은 시각에 연다
    - cron: "2,7,12,17,25 12 13,14,15 10 *"
    # 사전 점검(dry-run: 아직 안 풀린 묶음을 모두 풀어 해시만 확인, 쓰지 않음) — 10/19 · 10/20 09:17 KST. 실패하면 GitHub가 메일로 알린다
    - cron: "17 0 19,20 10 *"
    # r1 09:28 KST(00:28Z) → 00:20 · 00:25 · 00:30 · 00:35 · 00:43
    - cron: "20,25,30,35,43 0 21 10 *"
    # r2 11:15 KST(02:15Z) · r3 11:30 KST(02:30Z) → 02:07 · 02:12 · 02:17 · 02:22 · 02:27 · 02:30 · 02:32 · 02:37 · 02:45
    - cron: "7,12,17,22,27,30,32,37,45 2 21 10 *"
    # r4 13:15 KST(04:15Z) → 04:07 · 04:12 · 04:17 · 04:22 · 04:30
    - cron: "7,12,17,22,30 4 21 10 *"
    # r5 18:00 KST(09:00Z) → 08:52 · 08:57 · 09:02 · 09:07 · 09:15  /  r6 19:00 KST(10:00Z) → 09:52 · 09:57 · 10:02 · 10:07 · 10:15
    - cron: "52,57 8,9 21 10 *"
    - cron: "2,7,15 9,10 21 10 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = 풀어서 해시만 확인(쓰지 않음) · release = 시각이 된 묶음 공개 · force = only의 묶음을 지금 공개"
        type: choice
        options: [dry-run, release, force]
        default: dry-run
      only:
        description: "묶음 번호(쉼표로 여러 개) — force일 때 필수. 예: r2"
        type: string
        default: ""
      offset_min:
        description: "수업이 밀렸을 때 아직 안 나간 묶음을 N분 늦춘다(분)"
        type: string
        default: "0"

permissions:
  contents: write      # files 브랜치에 올린다
  actions: write       # pages.yml을 다시 돌린다(GITHUB_TOKEN으로 한 push는 다른 워크플로를 깨우지 않는다 — workflow_dispatch는 예외)

concurrency:
  group: d6-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'brainini/tradefin-ai-2026'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RELEASE_KEY: ${{ secrets.RELEASE_KEY }}
      MODE: ${{ github.event.inputs.mode || 'release' }}
      ONLY: ${{ github.event.inputs.only || '' }}
      OFFSET: ${{ github.event.inputs.offset_min || vars.D6_OFFSET_MIN || '0' }}
      SCHEDULE: ${{ github.event.schedule || '' }}
    steps:
      - uses: actions/checkout@v7                    # main — tools/release_due.py
      - uses: actions/checkout@v7                    # files 브랜치 — 봉인 묶음 · 색인 · 공개 결과
        with:
          ref: files
          path: _files
          fetch-depth: 0
      - name: 풀기
        id: run
        run: |
          set -euo pipefail
          args=(--files-root _files --arm-min 20)
          if [ "${OFFSET:-0}" != "0" ]; then args+=(--offset-min "$OFFSET"); fi
          if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
          if [ "$SCHEDULE" = "17 0 19,20 10 *" ] || [ "$MODE" = "dry-run" ]; then args+=(--verify-all); fi
          if [ "$MODE" = "force" ]; then args+=(--force); fi
          python3 tools/release_due.py "${args[@]}"
      - name: files 브랜치에 올리기
        if: steps.run.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd _files
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "release ${{ steps.run.outputs.ids }}"
          for i in 1 2 3; do
            if git push -q origin HEAD:files; then echo "올림"; exit 0; fi
            echo "push 거부(다른 커밋이 먼저 올라감) — 최신 files로 다시 풀어 올린다($i)"
            sleep 5
            git fetch -q origin files
            git reset -q --hard origin/files
            extra=()
            if [ -n "${ONLY:-}" ]; then extra+=(--only "$ONLY"); fi
            if [ "$MODE" = "force" ]; then extra+=(--force); fi
            if [ "${OFFSET:-0}" != "0" ]; then extra+=(--offset-min "$OFFSET"); fi
            (cd .. && python3 tools/release_due.py --files-root _files --arm-min 0 "${extra[@]}")
            git add -A
            if git diff --cached --quiet; then echo "이미 다른 실행이 올렸다"; exit 0; fi
            git commit -q -m "release ${{ steps.run.outputs.ids }} (다시)"
          done
          exit 1
      - name: 사이트 다시 만들기
        if: steps.run.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
