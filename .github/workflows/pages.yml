# 과정 사이트 빌드 → GitHub Pages 배포
# 처음 한 번: 저장소 Settings → Pages → Build and deployment → Source = "GitHub Actions"
# 그다음부터는 main에 push하거나 Actions 탭에서 "Run workflow"를 누르면 배포된다.
# 수업 파일(체크포인트 · 비교 기준 · PDF · 풀린 6일차 파일)은 main이 아니라 같은 저장소의 files 브랜치에 있다(템플릿 사본에 따라가지 않게).
#       빌드가 그 브랜치를 _files로 받아 tools/sync_site_assets.py --files-root _files 가 색인(_index.json)대로 docs/downloads/와 카드 조각을 만든다.
#       정답 원본(instructor/…/answers) · 원천(data/raw/)은 색인에 없고, 있어도 sync가 멈춘다.
# 열기 시각(open_at)이 있는 파일은 카드가 그 시각까지 잠겨 보인다(docs/javascripts/tf26.js). ZIP은 빌드 시각에 열린 파일만 담으므로
#       아래 schedule이 각 열기 시각 직후(+2 · +7 · +15분)에 다시 빌드한다. 6일차 자동 공개 뒤에는 d6-release.yml이 이 워크플로를 부른다.
# 템플릿 사본(Day2 개인 저장소 "Use this template", Day5 fork)에서는 이 워크플로가 돌지 않는다 —
#       두 잡 모두 `if: github.repository == 'brainini/tradefin-ai-2026'`로 막았다(사본마다 Pages 실패 메일이 가지 않게).
#       저장소를 다른 조직·이름으로 옮기면 이 두 줄과 mkdocs.yml의 site_url·repo_url을 함께 바꾼다.
name: site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "labs/**"
      - "data/day1/**"
      - "data/checkpoints/**"
      - "data/external/**"
      - "data/data_dictionary.xlsx"
      - "rag/**"
      - "agents/**"
      - "templates/**"
      - "app/sample_data/**"
      - "tools/sync_site_assets.py"
      - "tools/mkdocs_hooks.py"
      - "overrides/**"
      - "docs/javascripts/**"
      - "docs/stylesheets/**"
      - ".github/workflows/pages.yml"
  schedule:
    # 열기 시각 직후 다시 빌드(ZIP · 잠금 해제 반영) — KST 08:30 = 전날 23:30Z. 정각(0분)은 피한다
    - cron: "32,37,45 23 14,15,18,19 10 *"   # 10/15 · 10/16 · 10/19 · 10/20 08:30 시작 파일
    - cron: "37,42,50 6 15 10 *"            # 10/15 15:35 골든셋
    - cron: "17,22,30 5 19 10 *"            # 10/19 14:15 실험 카드 확인표(d4_cards_check)
    - cron: "47,52 5 19 10 *"               # 10/19 14:45 기대값 테스트
    - cron: "2,7,15 6 19 10 *"              # 10/19 15:00 실습 B 파일
    - cron: "2,7,15 9 16,19 10 *"           # 10/16 · 10/19 18:00 비교 기준
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NO_MKDOCS_2_WARNING: "true"   # mkdocs<2로 고정했으므로 Material의 MkDocs 2.0 안내 배너는 끈다

# 러너는 ubuntu-24.04로 고정한다 — ubuntu-latest는 2026-10-19부터 Ubuntu 26으로 바뀌어
# 과정(10/14–10/21) 중 같은 push의 빌드 환경이 달라질 수 있다. 과정이 끝난 뒤 ubuntu-latest로 되돌려도 된다.
jobs:
  build:
    if: github.repository == 'brainini/tradefin-ai-2026'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Checkout class files (files branch)    # 수업 파일 · 색인 _index.json · 풀린 6일차 파일 — main에는 없다
        uses: actions/checkout@v7
        with:
          ref: files
          path: _files
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install MkDocs
        run: pip install -r requirements-docs.txt
      - name: Copy learner files into docs/downloads
        run: python tools/sync_site_assets.py --files-root _files
      - name: Build (strict)
        run: mkdocs build --strict -d site
      - name: Check download links    # 카드는 원시 HTML이라 mkdocs --strict가 링크를 보지 않는다
        run: python tools/sync_site_assets.py --check-links site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.repository == 'brainini/tradefin-ai-2026'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
