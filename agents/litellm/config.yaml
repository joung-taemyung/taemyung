# LiteLLM 프록시 설정 — Day5·6 앱 공용 LLM 관문(선택 — 오늘 실습은 키 없이 모의 모드)
# 코드에는 별칭(fast-default · fast-backup · quality)만 쓰고 실제 모델 ID는 여기서만 바꾼다 → 모델 교체·퇴역 때 앱 수정 불필요.
# 모델 ID는 D-3(10/17)에 각 콘솔에서 다시 확인한다 [D-3 확인]. 키·DB 주소는 환경변수로만(이 파일·저장소에 값 금지).
#   OPENAI_API_KEY · GEMINI_API_KEY(결제 연결 유료 프로젝트 — 무료 등급 금지: 입력이 제품 개선에 쓰임) · ANTHROPIC_API_KEY
#   LITELLM_MASTER_KEY(관리용) · DATABASE_URL(가상 키에 필수 — Neon·Supabase 무료 Postgres)
# 실행 예: litellm --config agents/litellm/config.yaml --port 4000   (버전은 설치 때 고정: pip install "litellm[proxy]==<D-10 확인 버전>")

model_list:
  - model_name: fast-default            # 기본 — GPT-6 Luna($0.10 / $0.50, 1M 토큰당 입력/출력)
    litellm_params:
      model: openai/gpt-6-luna          # [D-3 확인] OpenAI 콘솔의 정확한 모델 ID
      api_key: os.environ/OPENAI_API_KEY
    model_info: {input_cost_per_token: 0.0000001, output_cost_per_token: 0.0000005}
  - model_name: fast-backup             # 예비 — Gemini 3.1 Flash-Lite($0.25 / $1.50). RPD 리셋 = 태평양 자정(10월 한국 16:00)
    litellm_params:
      model: gemini/gemini-3.1-flash-lite   # [D-3 확인]
      api_key: os.environ/GEMINI_API_KEY
    model_info: {input_cost_per_token: 0.00000025, output_cost_per_token: 0.0000015}
  - model_name: quality                 # 강사·공용 키 전용 — Claude Haiku 4.5($1 / $5). 수강생 키에는 열지 않는다(단가 10배)
    litellm_params:
      model: anthropic/claude-haiku-4-5     # 현행 ID(접미 날짜 없음). 퇴역 공지가 나오면 이 줄만 바꾼다 [D-3 확인]
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info: {input_cost_per_token: 0.000001, output_cost_per_token: 0.000005}

litellm_settings:
  num_retries: 1
  request_timeout: 30                   # 초 — 앱(core/llm.py) 타임아웃과 같다
  fallbacks: [{"fast-default": ["fast-backup"]}, {"quality": ["fast-default"]}]
  drop_params: true                     # 공급자가 모르는 매개변수(temperature 등)는 버린다
  turn_off_message_logging: true        # 프롬프트·응답 본문을 로그·DB에 저장하지 않는다(합성 데이터라도 최소 보관) [D-10 확인: 설정 이름]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

# ---------------------------------------------------------------------------------------------------------
# 가상 키(virtual key) 예산 — issue_keys.py가 /key/generate로 발급(결과 CSV·QR 카드는 저장소 밖 강사 폴더에만)
# | 키                     | 개수 | models                      | 예산                | rpm | 만료                         |
# | 수강생 L01–L20          | 20   | fast-default, fast-backup   | $3 / 1d             | 30  | 10d(10/12 발급 → 10/22 만료) |
# | 예비 L21–L22            | 2    | fast-default, fast-backup   | $3 / 1d             | 30  | 10d                          |
# | 강사 데모 INSTR         | 1    | + quality                   | $20 / 1d [교육용 가정] | 60  | 30d                          |
# | 공용(강사 데모) SHARED1–2 | 2   | + quality                   | $10 / 1d [교육용 가정] | 60  | 10d                          |
# | 시험 T01–T03(D-10~D-1)  | 3    | fast-default, fast-backup   | $1 / 1d             | 30  | 3d                           |
# - 공급자 쪽 상한도 따로 건다: OpenAI 프로젝트 한도 enforce $50 · Anthropic 워크스페이스 월 $30 · Gemini 유료 프로젝트 $30 → 합계 약 $150(예비 포함)
# - 수강생 키 이론상 최대 = 20명 × $3 × 2일 = $120. 11:50·16:50에 키별 지출 확인, 일 예산 60%를 넘는 키는 원인(반복 호출) 확인
# - 키가 새면 즉시 삭제(/key/delete) 후 예비 키. 과정 종료 7일 뒤(10/28) 키 전량 폐기·로그 삭제
